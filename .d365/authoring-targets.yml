schema_version: 1

# Generated by the D365 Craft guided setup (multi-solution authoring).
# Non-secret authoring identities only. Never store credentials, tokens,
# secrets, or secret-bearing URLs here.
environments:
  authoring-dataverse:
    environment_url: https://richav9uciorg.crm.dynamics.com
    environment_id: e173d4a4-c299-4696-9187-e53a34eb2132
    authentication_mode: interactive_user
    connection_alias: dataverse-authoring
    description: Generic Dataverse authoring environment.

solutions:
  letsgoentities:
    environment: authoring-dataverse
    unique_name: LetsGoEntities
    display_name: LetsGoEntities
    publisher_name: LetsGoPublisher
    publisher_prefix: lgpub
    publisher_option_value_prefix: 10000
    unpack_path: solutions/LetsGoEntities
  letsgocustomcomponents:
    environment: authoring-dataverse
    unique_name: LetsGoCustomComponents
    display_name: LetsGoCustomComponents
    publisher_name: LetsGoPublisher
    publisher_prefix: lgpub
    publisher_option_value_prefix: 10000
    unpack_path: solutions/LetsGoCustomComponents
    component_projects:
      - component_type: code_plugin
        path: src/plugins/LetsGoCustomComponentsPlugins
        project_type: dotnet_class_library
      - component_type: code_custom_api
        path: src/plugins/LetsGoCustomComponentsPlugins
        project_type: dotnet_class_library
      - component_type: code_pcf
        path: src/pcf/LetsGoCustomComponentsControls
        project_type: pcf_project
      - component_type: code_webres_*
        path: src/webresources/LetsGoCustomComponentsWebResources
        project_type: web_resource_source
  letsgosolutionsecurity:
    environment: authoring-dataverse
    unique_name: LetsGoSolutionSecurity
    display_name: LetsGoSolutionSecurity
    publisher_name: LetsGoPublisher
    publisher_prefix: lgpub
    publisher_option_value_prefix: 10000
    unpack_path: solutions/LetsGoSolutionSecurity

targets:
  letsgoentities-authoring:
    kind: dataverse_solution
    environment: authoring-dataverse
    solution: letsgoentities
  letsgocustomcomponents-authoring:
    kind: dataverse_solution
    environment: authoring-dataverse
    solution: letsgocustomcomponents
  letsgosolutionsecurity-authoring:
    kind: dataverse_solution
    environment: authoring-dataverse
    solution: letsgosolutionsecurity
  dataverse-environment-authoring:
    kind: dataverse_environment
    environment: authoring-dataverse

routing:
  # Environment-bound data components take precedence over their broader
  # solution-bound families; exact component_type matches beat wildcards.
  - match: {component_type: sec_business_unit}
    target: dataverse-environment-authoring
  - match: {component_type: sec_team}
    target: dataverse-environment-authoring
  - match: {component_type: config_queue}
    target: dataverse-environment-authoring
  - match: {component_type: config_audit}
    target: dataverse-environment-authoring
  - match: {component_type: schema_*}
    target: letsgoentities-authoring
  - match: {component_type: config_*}
    target: letsgoentities-authoring
  - match: {component_type: uiux_*}
    target: letsgocustomcomponents-authoring
  - match: {component_type: flow_*}
    target: letsgocustomcomponents-authoring
  - match: {component_type: code_*}
    target: letsgocustomcomponents-authoring
  - match: {component_type: mcs_*}
    target: letsgocustomcomponents-authoring
  - match: {component_type: sec_*}
    target: letsgosolutionsecurity-authoring
  - match: {component_type: integ_*}
    target: letsgocustomcomponents-authoring
